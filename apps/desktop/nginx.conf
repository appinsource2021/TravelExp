server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 dogrulamasi (yenileme icin acik kalmali)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://upbeat-margulis.217-160-215-57.plesk.page$request_uri;
    }
}

server {
    listen 443 ssl;
    # http2 KAPALI: HTTP/2'de Upgrade basligi yok, WebSocket handshake'i (/socket)
    # duz GET'e donusup node'dan 404 aliyor. Bu SPA icin h2'nin kazanci ihmal edilebilir.
    server_name upbeat-margulis.217-160-215-57.plesk.page;

    ssl_certificate     /etc/letsencrypt/live/upbeat-margulis.217-160-215-57.plesk.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upbeat-margulis.217-160-215-57.plesk.page/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;
    set $upstream node:3007;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
