# mcp.appinsource.eu -> mcp-dev-server (compose projesi "mcp", container port 3000)
#
# Sertifika: Let's Encrypt, certbot --webroot ile alındı (2026-09-30).
# Yenilemeyi /etc/cron.d/travelexp-certbot yapar; o cron `certbot renew` sonrası zaten
# `docker exec travelexpenses_desktop nginx -s reload` çalıştırıyor ve bu soyu da kapsar.
# (certbot --deploy-hook burada kullanılamaz: yenileme certbot/certbot konteynerinde
#  çalışıyor, o konteynerde docker CLI/socket yok, içeriden proxy reload edilemez.)
#
# UPSTREAM neden host.docker.internal DEĞİL:
#   mcp-dev-server portunu `127.0.0.1:8070:3000` olarak, yani yalnızca loopback'e
#   yayınlıyor (.env: MCP_BIND_ADDRESS=127.0.0.1). host.docker.internal host'un
#   gateway IP'sine (172.17.0.1) çözülür, oraya bağlanmak 8070 loopback'te
#   dinlediği için başarısız olur. Bu yüzden bu konteyner mcp projesinin `edge`
#   ağına (mcp_edge) bağlandı ve uygulamaya konteyner adıyla, 3000 portundan
#   doğrudan gidiyoruz. mcp'nin compose'u bu ağı tam bu amaç için tanımlıyor
#   ("Your reverse proxy forwards https://<MCP_DOMAIN> to this address").
#
# resolver + değişken kalıbı default.conf'tan alındı: proxy_pass'te değişken
# kullanılınca nginx upstream adını AÇILIŞTA çözmeye çalışmaz, her istekte çözer.
# Böylece mcp konteyneri kapalıyken bile nginx ayağa kalkar ve diğer siteler
# etkilenmez (sabit ad yazılsaydı nginx hiç başlamazdı).

# MCP akışları (SSE / streamable HTTP) ve olası WebSocket yükseltmeleri için;
# ad çakışmasın diye domaine özel isimlendirildi.
map $http_upgrade $mcp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.appinsource.eu;

    # Let's Encrypt HTTP-01 doğrulaması (yenileme için açık kalmalı,
    # yönlendirmeden ÖNCE gelmeli)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 KAPALI: default.conf ve reisekosten ile aynı gerekçe — HTTP/2'de
    # Upgrade başlığı yok, WebSocket handshake'i düz GET'e dönüşüp bozuluyor.
    server_name mcp.appinsource.eu;

    ssl_certificate     /etc/letsencrypt/live/mcp.appinsource.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.appinsource.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Ayrı zone adı: default.conf'taki "SSL" ve reisekosten'in zone'u ile çakışmasın.
    ssl_session_cache   shared:SSL_mcp:10m;
    ssl_session_timeout 1d;

    # Docker gömülü DNS'i; adı istek anında çöz (bkz. yukarıdaki not)
    resolver 127.0.0.11 valid=10s;
    set $mcp_upstream mcp-mcp-1:3000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mcp_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP SSE / streamable HTTP: yanıtlar tamponlanmadan akmalı
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# Önizlemeler: https://<ad>-<kullanıcı>.dev.romon-group.com -> mcp-dev-server önizleme proxy'si (container port 3001)
# Sertifika: acme.sh (IONOS DNS, wildcard) -> /etc/letsencrypt/acme/dev.romon-group.com
# ---------------------------------------------------------------------------
map $http_upgrade $mcp_preview_connection { default upgrade; '' ""; }

server {
    listen 80;
    listen [::]:80;
    server_name *.dev.romon-group.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.dev.romon-group.com;

    ssl_certificate     /etc/letsencrypt/acme/dev.romon-group.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/acme/dev.romon-group.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_mcp_preview:10m;
    ssl_session_timeout 1d;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s;
    set $mcp_preview_upstream mcp-mcp-1:3001;

    location / {
        proxy_pass http://$mcp_preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcp_preview_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# ---------------------------------------------------------------------------
# Kısa önizlemeler: https://<ad>.romon-group.com -> aynı önizleme proxy'si (container port 3001)
# DNS: *.romon-group.com A 217.160.215.57 (wildcard; tanımlı kayıtlar www/mail/dev/... etkilenmez)
# Sertifika: acme.sh (IONOS DNS, wildcard) -> /etc/letsencrypt/acme/romon-group.com
# Sadece tek seviyeli adlar. dm/dmts/nsdm bu sunucuya açık DNS kaydıyla geliyor ve daha önce de
# default sunucuya düşüyordu; davranışları değişmesin diye hariç tutuldu (MCP'de de ayrılmış adlar).
# *.dev.romon-group.com yukarıdaki wildcard bloğunda kalır (wildcard adlar regex'ten önce eşleşir).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?!(?:dm|dmts|nsdm)\.)[a-z0-9-]+\.romon-group\.com$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?!(?:dm|dmts|nsdm)\.)[a-z0-9-]+\.romon-group\.com$;

    ssl_certificate     /etc/letsencrypt/acme/romon-group.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/acme/romon-group.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_mcp_preview:10m;
    ssl_session_timeout 1d;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s;
    set $mcp_preview_upstream mcp-mcp-1:3001;

    location / {
        proxy_pass http://$mcp_preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcp_preview_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
