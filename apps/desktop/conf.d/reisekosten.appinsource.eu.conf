# reisekosten.appinsource.eu -> host üzerindeki Vite dev server (:5173)
#
# Sertifika: Let's Encrypt, certbot --webroot ile alındı (2026-09-24).
# Yenilemeyi /etc/cron.d/travelexp-certbot yapar; o cron yenileme sonrası
# zaten `docker exec travelexpenses_desktop nginx -s reload` çalıştırıyor.
#
# Upstream host.docker.internal üzerinden: bu konteyner 127.0.0.1:5173'e
# ulaşamaz, host-gateway extra_hosts ile docker-compose.yml'de tanımlı.

# Vite HMR WebSocket'i için; ad çakışmasın diye domaine özel isimlendirildi.
map $http_upgrade $reisekosten_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name reisekosten.appinsource.eu;

    # Let's Encrypt HTTP-01 doğrulaması (yenileme için açık kalmalı,
    # yönlendirmeden ÖNCE gelmeli)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 KAPALI: default.conf ile aynı gerekçe — HTTP/2'de Upgrade başlığı
    # yok, Vite HMR WebSocket handshake'i düz GET'e dönüşüp bozuluyor.
    server_name reisekosten.appinsource.eu;

    ssl_certificate     /etc/letsencrypt/live/reisekosten.appinsource.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reisekosten.appinsource.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Ayrı zone adı: default.conf'taki "SSL" zone'u ile çakışmasın.
    ssl_session_cache   shared:SSL_reisekosten:10m;
    ssl_session_timeout 1d;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;

        # Vite dev server HMR WebSocket bağlantısı
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $reisekosten_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
}
